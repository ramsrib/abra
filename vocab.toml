# abra seed dictionary — phrase replacements applied to raw STT output.
# Matched case-insensitively on word boundaries, longest phrase first.
#
# These starter rules fix mishears everyone hits with abra, and ship with the
# engine. YOUR words go in ~/.abra/vocab.local.toml — same format, merged on
# top of this file, added from the menu bar (abra ▸ Dictionary…) or by hand.

[replace]
"come in and push" = "commit and push"
"come eat and push" = "commit and push"
"uv run a bra" = "uv run abra"
"a bra" = "abra"
